<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内知 · 内部知识问答</title>
    <script>
      // 首屏渲染前应用主题偏好，避免浅色主题下先闪一帧深色
      try {
        if (localStorage.getItem("web-agent-theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
