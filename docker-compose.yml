services:
  db:
    image: pgvector/pgvector:pg16
    container_name: web-agent-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webagent_secret}
      POSTGRES_DB: ${POSTGRES_DB:-webagent}
    # 4GB 内存调优：压低缓存；不映射 5432 到主机（仅容器内网访问，更安全）
    command: postgres -c shared_buffers=128MB -c work_mem=16MB -c max_connections=50 -c effective_cache_size=1GB
    mem_limit: 512m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webagent} -d ${POSTGRES_DB:-webagent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: web-agent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    # 不映射 9000/9001 到主机（仅容器内网访问；console 需要时用 SSH 隧道）
    mem_limit: 384m
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: web-agent-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MINIO_BUCKET:-web-agent-docs};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-web-agent-docs}

  backend:
    build: ./backend
    image: knowledgeqa-backend:${IMAGE_TAG:-current}
    container_name: web-agent-backend
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-webagent}:${POSTGRES_PASSWORD:-webagent_secret}@db:5432/${POSTGRES_DB:-webagent}
      MINIO_ENDPOINT: minio:9000
      FASTEMBED_CACHE_PATH: /data/models
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEPLOY_PROFILE: ${DEPLOY_PROFILE:-production}
      # 限制 ONNX/fastembed 线程，避免多线程吃满 CPU/内存（4GB 机器）
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
    mem_limit: 768m
    ports:
      - "8000:8000"
    volumes:
      - modelcache:/data/models
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # python:3.12-slim 无 wget/curl，用标准库 urllib 探测；127.0.0.1 避免 localhost 解析到 ::1
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=5).status == 200 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 90s

  worker:
    image: knowledgeqa-backend:${IMAGE_TAG:-current}
    container_name: web-agent-worker
    command: python -m worker.main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-webagent}:${POSTGRES_PASSWORD:-webagent_secret}@db:5432/${POSTGRES_DB:-webagent}
      MINIO_ENDPOINT: minio:9000
      FASTEMBED_CACHE_PATH: /data/models
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEPLOY_PROFILE: ${DEPLOY_PROFILE:-production}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
    # worker 加载 BGE 模型 + 推理是内存大头；限制防拖垮整机
    mem_limit: 1536m
    volumes:
      - modelcache:/data/models
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: knowledgeqa-frontend:${IMAGE_TAG:-current}
    container_name: web-agent-frontend
    mem_limit: 128m
    ports:
      - "5173:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 生产 HTTPS 反代（profile: production，用 --profile production 启动）
  nginx:
    image: nginx:1.27-alpine
    container_name: web-agent-nginx
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.rendered.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # 方案 A 回源反代（EdgeOne Pages 前端 + CVM 后端）：仅反代 /api，不服务前端静态。
  # 用 --profile edgeone 启动；配置由 deploy/nginx/setup-https-edgeone.sh 渲染生成。
  nginx-edgeone:
    image: nginx:1.27-alpine
    container_name: web-agent-nginx-edgeone
    profiles: ["edgeone"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.edgeone.rendered.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy

  # CDN 回源反代（EdgeOne CDN 边缘 HTTPS + 回源 HTTP）：前端 + /api 一体反代，免自配证书。
  # 用 --profile cdn 启动（含 frontend）。
  nginx-cdn:
    image: nginx:1.27-alpine
    container_name: web-agent-nginx-cdn
    profiles: ["cdn"]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.cdn.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  modelcache:
