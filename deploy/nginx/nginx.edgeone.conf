# 方案 A（EdgeOne Pages 前端 + CVM 回源）：nginx 仅反代 /api 到 backend，SSE 关缓冲。
# 前端静态在 EdgeOne Pages，CVM 不服务前端；回源域名用 ${SERVER_NAME}（如 api.example.com）。

# HTTP 强制跳 HTTPS（80 兼用于 ACME 证书挑战续期）
server {
    listen 80;
    server_name ${SERVER_NAME};
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m;  # 匹配后端 20MB 上传上限（留余量）

    # API + SSE：关闭代理缓冲，长超时支撑流式打字机
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 健康检查（EdgeOne 回源探测 / 运维探活）
    location = /healthz {
        proxy_pass http://backend:8000/api/healthz;
        proxy_http_version 1.1;
    }

    # 其余一律 404（CVM 不服务前端）
    location / {
        return 404;
    }
}
