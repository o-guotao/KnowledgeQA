# CDN 回源反代：EdgeOne CDN 在边缘终止 HTTPS（免费证书），回源 HTTP 到本服务 80。
# 前端静态 → frontend:80，/api → backend:8000（SSE 关缓冲）。无需自配证书。
server {
    listen 80;
    server_name _;  # CDN 回源，Host 为加速域名（qa.你的域名）

    client_max_body_size 25m;  # 匹配后端 20MB 上传上限（留余量）

    # API + SSE：关闭代理缓冲，长超时支撑流式打字机
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # CDN 边缘为 HTTPS，告知后端外部协议
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 健康检查（CDN 回源探测 / 运维探活）
    location = /healthz {
        proxy_pass http://backend:8000/api/healthz;
        proxy_http_version 1.1;
    }

    # 前端静态资源
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
